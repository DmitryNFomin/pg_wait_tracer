# CI safety net (Phase B1 of docs/ROADMAP_AND_STATUS.md)
#
# Core jobs:
#   build-and-unit  — full build (BPF tracer + pgwt-server), C unit tests,
#                     Python synthetic-data correctness tests
#   sampled-overhead — paired sampled/no-tracer catastrophic-regression gate
#   web-ui          — Playwright suite against tests/mock_server.py; any
#                     browser console error fails the test that caused it
#   protocol-drift  — same JSON-line commands against the real pgwt-server
#                     (trace fixture generated in CI, nothing committed) and
#                     against the mock; response schemas must match
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual trigger used to (re)generate the B4 visual-snapshot baselines IN CI
  # — the only environment whose chromium/font rendering matches the gating
  # compare. `update_snapshots: true` runs the snapshot suite with
  # --update-snapshots and uploads the produced PNGs as an artifact (see the
  # `snapshots` job). Download, commit under tests/web_snapshots/, push.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate visual-snapshot baselines and upload them as an artifact"
        type: boolean
        default: false
      iterations:
        description: "Number of full ci_smoke.sh sequence runs"
        type: string
        default: "25"
      pg:
        description: "PostgreSQL major version for the mode-4 hunt"
        type: string
        default: "17"
      mode4_hunt:
        description: "Run the 360-minute mode-4 BPF hunt on a hosted runner"
        type: boolean
        default: false

jobs:
  changed_files:
    # Drives how much of the self-hosted gate-box capture matrix runs below.
    # Real numbers that motivated this: 8 open PRs produced ~20 CI runs, each
    # pinning 5 jobs to [self-hosted, gate-box] (capture-smoke PG 13/16/17/18
    # + sampled-overhead) at ~10-15 min/cell serial — hours of queue — while
    # 4 of those 8 PRs touched no src/ and no src/bpf/ at all (docs, a test
    # harness, a dev-gallery timing fix, a UI builder).
    #
    # src/ (including src/bpf/) is the ONLY thing that can change capture,
    # accounting, discovery or the daemon, so it always gets the FULL matrix
    # — this job only ever narrows the tier, never widens what src/ triggers.
    # workflow_dispatch (agents' pre-PR gate-box evidence) diffs against its
    # merge-base with the default branch, same shape as a PR. Any other
    # trigger has no clean diff to classify and defaults to "run everything"
    # — the safe direction is to over-cover, never under-cover.
    name: changed-files
    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.filter.outputs.src_changed }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change (src/ vs web+tests+tooling vs docs-only)
        id: filter
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          FILES=""
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            FILES=$(git diff --name-only "$BASE"..."$HEAD")
          elif [ "$EVENT" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
              FILES=$(git diff --name-only "$BEFORE" "$AFTER")
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual dispatch against a branch (the carve-out's "gh
            # workflow run evidence on the gate box" -- agents proving a
            # branch before a PR exists to attach to). fetch-depth: 0 above
            # fetches every branch's history, so the default branch's ref is
            # available locally; diff this ref against their merge base,
            # same shape as the pull_request branch above.
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            if git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
              MERGE_BASE=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
              FILES=$(git diff --name-only "$MERGE_BASE" HEAD)
            fi
          fi

          {
            echo "event=$EVENT"
            echo "changed files:"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$FILES" ]; then
            echo "(no changed files detected for this trigger) -- treating as full change" >> "$GITHUB_STEP_SUMMARY"
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r f; do echo "  $f"; done <<< "$FILES" >> "$GITHUB_STEP_SUMMARY"

          if echo "$FILES" | grep -qE '^src/'; then
            SRC=true
          else
            SRC=false
          fi

          # docs-only: every changed file is under docs/ or ends in .md
          if echo "$FILES" | grep -qvE '^docs/|\.md$'; then
            DOCS_ONLY=false
          else
            DOCS_ONLY=true
          fi

          echo "src_changed=$SRC" >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "src_changed=$SRC docs_only=$DOCS_ONLY" >> "$GITHUB_STEP_SUMMARY"

  build-and-unit:
    name: build-and-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev \
            zlib1g-dev liblz4-dev linux-tools-common
          # bpftool: the runner's HWE azure kernel ships linux-tools without
          # a bpftool binary (only the dispatch wrapper), so a packaged
          # bpftool may not exist. Use it if it works; otherwise build a
          # pinned bpftool from source (~30s, needs only libelf/zlib).
          if bpftool version >/dev/null 2>&1; then
            BPFTOOL=$(command -v bpftool)
          else
            git clone --depth 1 --branch v7.5.0 --recurse-submodules \
              https://github.com/libbpf/bpftool.git /tmp/bpftool
            make -C /tmp/bpftool/src -j"$(nproc)"
            BPFTOOL=/tmp/bpftool/src/bpftool
          fi
          "$BPFTOOL" version
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"
          # The BPF build generates vmlinux.h from the running kernel's BTF
          test -r /sys/kernel/btf/vmlinux

      - name: Build (BPF tracer + pgwt-server)
        run: make

      - name: Build C unit tests
        run: make -C tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies (pillow, numpy)
        # tests/test_ui_live_smoke_lib.py (in unit_tests.list, issue #93)
        # decodes/diffs PNGs with these; nothing else in this job's
        # unit_tests.list entries needs them. setup-python (not the runner's
        # bare system python3) -- ubuntu-latest (24.04) is PEP-668
        # externally-managed, so a bare `pip install` against the system
        # interpreter aborts outright; the other two pip-using jobs in this
        # file already use actions/setup-python for the same reason.
        run: python3 -m pip install pillow numpy

      - name: Run C unit tests
        # The test list lives in tests/unit_tests.list — the single source of
        # truth shared with tests/run_all.sh (TST-3: the two hand-maintained
        # lists had drifted; test_event_writer/test_event_reader were missing
        # from run_all and test_concurrent_rw ran nowhere).
        run: make -C tests check

      - name: Run synthetic data tests
        run: |
          set -e
          for t in tests/test_data_*.py; do
            echo "=== $t ==="
            python3 "$t"
          done
          python3 tests/test_current_trace.py

      - name: Run web UI builder unit tests (Node, no browser — Phase B3)
        # Pure builders (data -> ECharts option / table model) and the state /
        # transport / selection modules are Node-testable without a browser.
        # A builder off-by-one fails here in milliseconds, no Playwright needed.
        run: node --test 'tests/web_unit/*.test.mjs'

      - name: Bridge integration test (Go client ↔ real pgwt-server — T6)
        # Spawns the REAL pgwt-server (built above) over a local pipe (no SSH)
        # behind the Go bridge and drives it through actual WebSockets:
        # request/response id rewriting, two-connection id-collision isolation
        # (UI-2), upstream death → transport error envelope + respawn (UI-1/3),
        # session-token gating (UI-12), and the server's id-first envelope
        # invariant (UI-8). Uses ../pgwt-server and ../tests/gen_test_traces.
        env:
          PGWT_BRIDGE_TEST_REQUIRE: "1"
        run: cd web && go test -race ./...

  sampled-overhead:
    # Stage 5: timing on a shared runner is deliberately coarse.  The paired
    # median catches the historical 20-30% trap/scan regressions. A candidate
    # hard failure gets seven more pairs so the final 14 are AB/BA-balanced.
    # The fixed budget is 21 primary plus at most 21 confirmation pairs; the
    # 60-minute timeout leaves headroom above a conservative 40-minute budget.
    # Deterministic lifecycle/resolver tests retain implementation invariants.
    #
    # docs/DEV_LOOP_PLAN.md step 1: moved to the persistent gate box (real
    # hardware, no noisy-neighbour hypervisor) instead of ubuntu-latest.
    #
    # No `concurrency:` block (issue #126; removed 2026-09-18 — previously
    # had a per-job-identity group here, added to fix a real bug: a single
    # literal "gate-box" group shared by all 5 moved jobs cancelled 3-4 of
    # them outright with zero duration the instant they all became eligible
    # at once, since GitHub cancels a group's previously-PENDING job the
    # moment a new job joins the same group. A per-job-identity group fixed
    # that, but introduced a different instance of the SAME bug one level
    # up: when two CI runs (e.g. two PRs) both queue this job, GitHub
    # cancels the OLDER run's still-pending job the moment the newer run's
    # job joins the identical group — observed on PR #124 run 35354092704,
    # `capture-smoke (PG 18)` cancelled after 71 min of queueing instead of
    # eventually running. No group is needed for correctness: the gate
    # box's runner takes one job at a time by default
    # (tests/provision-runner.sh does not pass --ephemeral or any
    # multi-job flag), and every build/test step below additionally holds
    # /tmp/pgwt-box-check.lock (also serialising against an agent's ad hoc
    # `make box-check` over ssh, which no concurrency group could ever see
    # anyway) — that lock, not a concurrency group, is what actually
    # prevents same-box overlap, and it queues rather than cancels.
    # Fork PRs (reviewer round 2, option c): a job-level `if:` that SKIPS the
    # job for a fork PR is the wrong shape — GitHub scores a skipped required
    # check as passing, so a fork PR would be mergeable with zero capture/
    # overhead coverage. Instead the job always runs; `runs-on` itself picks
    # `ubuntu-latest` for a fork PR (never touches the self-hosted label, so
    # the gate box is unreachable for fork code even for job scheduling) and
    # the first step below is the ONLY step that executes there — it fails
    # loudly, so the required check is red, not green-by-omission, until a
    # maintainer re-hosts the PR's head as `agent/<slug>` and re-runs. It
    # runs on a hosted runner, so it needs no group either.
    name: sampled-overhead (PG 17)
    needs: changed_files
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","gate-box"]') }}
    # timeout-minutes: the gate itself takes ~9 min on the box; the rest is
    # the bounded wait (120 min) for /tmp/pgwt-box-check.lock, which agents'
    # `make box-check` runs hold for 45-80 min each. Queueing is the design.
    timeout-minutes: 180
    steps:
      # The ONLY step that runs for a fork PR (on ubuntu-latest, per
      # runs-on above): fails on purpose so the required check is red, not
      # skipped-therefore-green. Skipped entirely (a no-op) for every other
      # trigger.
      - name: Refuse fork PR (gate checks need a maintainer to re-host)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "gate checks run only from a branch in this repository; a maintainer must push this PR's head to agent/<slug> and re-run" >&2
          exit 1

      # Path-filter gate (changed-files job): sampled-overhead only ever
      # measures overhead of the capture path itself, so it is only needed
      # when src/ (or src/bpf/) changed — never for web/tests/tooling-only
      # or docs-only changes. This step RUNS (never a job-level `if:`, which
      # would report as GitHub's "skipped" conclusion) and every step below
      # is individually gated on its output, so the check always completes
      # with an explicit pass/fail, keeping the required-status-checks
      # contract intact (9 named checks; see branch protection).
      - name: Determine whether sampled-overhead is needed
        id: needed_filter
        run: |
          if [ "${{ needs.changed_files.outputs.src_changed }}" = "true" ]; then
            NEEDED=true
          else
            NEEDED=false
          fi
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          if [ "$NEEDED" = "true" ]; then
            echo "sampled-overhead: running (src_changed=${{ needs.changed_files.outputs.src_changed }})" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "sampled-overhead: SKIPPED -- no src/ change this run; reports success to satisfy the required check" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Real bug found running this against the box for the first time: this
      # is a PERSISTENT runner (not ephemeral) reusing the same
      # $GITHUB_WORKSPACE across jobs, and every test step below runs test
      # code under `sudo` (root) — a prior job's sudo-run python3 leaves
      # root-owned tests/__pycache__/*.pyc behind. The unprivileged 'runner'
      # user that owns the workspace can't unlink those, so actions/checkout
      # (which starts by cleaning the workspace) fails outright with EACCES
      # before this job does anything of its own. Reclaim ownership first.
      - name: Reclaim workspace ownership (previous job may have left root-owned files)
        if: steps.needed_filter.outputs.needed == 'true'
        run: sudo chown -R "$(id -un):$(id -gn)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      # Self-heal: a root-created 0644 lock file (e.g. from provision-runner.sh
      # before its own chmod fix, or a fresh /tmp after a reboot) wedges every
      # gate-box step's `exec 9>...` for the unprivileged 'runner' user.
      - name: Ensure gate-box lock file is writable
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          [ -w /tmp/pgwt-box-check.lock ] || sudo sh -c 'touch /tmp/pgwt-box-check.lock && chmod 0666 /tmp/pgwt-box-check.lock'

      - uses: actions/checkout@v4
        if: steps.needed_filter.outputs.needed == 'true'

      - name: Record start time (for wall-time measurement)
        if: steps.needed_filter.outputs.needed == 'true'
        id: start_time
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Record runner capacity
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true

      # tests/provision-runner.sh writes this marker once the gate box has
      # build deps + bpftool + PostgreSQL 13/16/17/18 already installed and
      # running on ports 5413/5416/5417/5418 — skip reinstalling/reconfiguring
      # PostgreSQL and reuse that cluster directly. Any self-hosted,gate-box
      # runner WITHOUT the marker falls back to the hosted-style install path
      # below UNLESS it's actually self-hosted (see the refusal step next),
      # in which case that path is destructive and must never run.
      - name: Detect pre-provisioned gate box
        if: steps.needed_filter.outputs.needed == 'true'
        id: gate_box
        run: |
          if [ -f /etc/pgwt-gate-box ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Reviewer finding: the fallback install path below runs
      # `pg_dropcluster` on every existing cluster before reinstalling on
      # port 5432 — correct for a genuinely fresh `ubuntu-latest` runner,
      # destructive on any self-hosted runner that merely lacks the marker
      # (a mis-labelled future ephemeral runner, or this box before its
      # first provisioning run). `runner.environment` (`github-hosted` /
      # `self-hosted`) is the authoritative signal, unlike `RUNNER_NAME`
      # (set identically either way, so not a discriminator on its own).
      # The hosted-style path stays reachable only for an actual hosted
      # runner — which `runs-on: [self-hosted, gate-box]` no longer offers
      # this job anyway, so today it is also unreachable there; this refusal
      # is the enforced, not just structural, guarantee.
      - name: Refuse destructive re-install on an unprovisioned self-hosted runner
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true' && runner.environment != 'github-hosted'
        run: |
          echo "FATAL: gate-box marker missing; run tests/provision-runner.sh ubuntu" >&2
          exit 1

      - name: Install build dependencies
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev \
            zlib1g-dev liblz4-dev linux-tools-common
          if bpftool version >/dev/null 2>&1; then
            BPFTOOL=$(command -v bpftool)
          else
            git clone --depth 1 --branch v7.5.0 --recurse-submodules \
              https://github.com/libbpf/bpftool.git /tmp/bpftool
            make -C /tmp/bpftool/src -j"$(nproc)"
            BPFTOOL=/tmp/bpftool/src/bpftool
          fi
          "$BPFTOOL" version
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"
          test -r /sys/kernel/btf/vmlinux

      - name: Install PostgreSQL 17 (PGDG apt)
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          set -x
          sudo systemctl stop postgresql || true
          sudo apt-get install -y postgresql-common
          pg_lsclusters -h | awk '{print $1, $2}' | while read -r ver name; do
            sudo pg_dropcluster --stop "$ver" "$name" || true
          done
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-contrib-17

      - name: Configure PostgreSQL 17
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          set -ex
          if ! pg_lsclusters -h | awk '$1 == 17 && $2 == "main"' | grep -q .; then
            sudo pg_createcluster 17 main
          fi
          sudo pg_conftool 17 main set port 5432
          sudo pg_conftool 17 main set shared_preload_libraries pg_stat_statements
          sudo pg_conftool 17 main set compute_query_id on
          sudo sed -i -E 's/(peer|scram-sha-256|md5)$/trust/' \
            /etc/postgresql/17/main/pg_hba.conf
          sudo pg_ctlcluster 17 main start
          psql -U postgres -d postgres -c \
            "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
          psql -U postgres -d postgres -tAc "SELECT version()"
          echo "SO_PGPORT=5432" >> "$GITHUB_ENV"

      # Gate box already has PG17 on port 5417 (provision-runner.sh); no
      # install/config step ran above, so resolve BPFTOOL and the port here.
      # Locked: provision-runner.sh restarts clusters inside this same lock,
      # so probing psql without it could hit a cluster mid-restart.
      - name: Resolve gate-box PostgreSQL port + bpftool
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present == 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          command -v bpftool >/dev/null || { echo "FATAL: bpftool not on PATH on the gate box" >&2; exit 1; }
          echo "BPFTOOL=$(command -v bpftool)" >> "$GITHUB_ENV"
          echo "SO_PGPORT=5417" >> "$GITHUB_ENV"
          psql -U postgres -h /var/run/postgresql -p 5417 -d postgres -tAc "SELECT version()"

      - name: Build tracer
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          make

      - name: Run sampled-overhead structural unit gates
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          make -C tests test_exact_probe test_pgss_resolver test_query_text
          tests/test_exact_probe
          tests/test_pgss_resolver
          tests/test_query_text

      - name: Gate paired sampled overhead
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          PM_PID=$(sudo head -1 /var/lib/postgresql/17/main/postmaster.pid)
          sudo env "PATH=/usr/lib/postgresql/17/bin:$PATH" \
            "BPFTOOL=$BPFTOOL" \
            python3 tests/sampled_overhead_gate.py \
              --pid "$PM_PID" --pg-version 17 --port "$SO_PGPORT" \
              --reps 7 --confirm-reps 7 --duration 10 --warmup 2 \
              --clients 4 --jobs 4 --scale 10 \
              --high-cardinality-shapes 256 --min-distinct-shapes 231 \
              --warn-overhead-pct 10 --max-overhead-pct 15 \
              --max-pgss-scans-per-sec 1 \
              --output-json sampled-overhead.json

      - name: Upload sampled-overhead data
        if: always() && steps.needed_filter.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sampled-overhead
          path: sampled-overhead.json
          if-no-files-found: warn

      # Not a gate — informational only (e): reports wall time against the
      # dev-loop plan's 15-minute target; never fails the job.
      - name: Report sampled-overhead wall time
        if: always()
        run: |
          END=$(date +%s)
          START="${{ steps.start_time.outputs.epoch }}"
          if [ -z "$START" ]; then
            echo "sampled-overhead job wall time: unknown (an earlier step failed before start time was recorded)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            DUR=$((END - START))
            echo "sampled-overhead job wall time: ${DUR}s ($((DUR / 60))m $((DUR % 60))s) — plan target: under 900s (15m)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  capture-smoke:
    # Phase T0 (Trust Milestone, TST-1/2): run the REAL capture path against
    # a real PostgreSQL on the runner. Every field escape to date (#8, #24,
    # #30, #31) lived in the capture/discovery slice that the other jobs
    # never execute; this job's entire purpose is to go red when capture
    # silently records nothing.
    #
    # Watchpoints (perf hardware breakpoints) may be unavailable on hosted
    # runners' hypervisor — tests/ci_smoke.sh probes for them empirically:
    # if present, --mode full is asserted as hard as tiered; if absent, the
    # full-mode section is skipped LOUDLY in the job summary while the
    # tiered/sampled assertions (the shipped default) remain the hard gate.
    # Matrix: PG 13 / 17 / 18 are the SUPPORTED versions (README+INSTALL)
    # and get the full capture assertions. PG 16 is NOT yet supported
    # (PG<17 needs a header-derived offsetof(PGPROC, wait_event_info) and
    # only PG13's is validated — Track D owns 14-16): its cell asserts the
    # fail-safe contract instead — the tracer must REFUSE loudly, never
    # trace garbage (verified empirically: it exits with a FATAL). When
    # Track D lands, flip the cell to the full assertions.
    # docs/DEV_LOOP_PLAN.md step 1: moved to the persistent gate box instead
    # of ubuntu-latest — real hardware + real kernel for the capture path
    # every field escape to date lived in.
    #
    # No `concurrency:` block (issue #126; removed 2026-09-18) — see
    # sampled-overhead's own comment above for the full history: a
    # per-job-identity group here originally fixed a real bug (one literal
    # "gate-box" group shared across this job's 4 matrix cells plus
    # sampled-overhead cancelled 3-4 of them outright with zero duration
    # the instant all 5 became eligible at once), but the per-cell group
    # it was replaced with reproduced the SAME class of bug one level up:
    # when two CI runs both queue the same cell, GitHub cancels the OLDER
    # run's still-pending job the moment the newer run's job joins the
    # identical group — observed on PR #124 run 35354092704,
    # `capture-smoke (PG 18)` cancelled after 71 min of queueing instead of
    # eventually running. No group is needed: the gate box's runner takes
    # one job at a time by default, and every build/test step below
    # additionally holds /tmp/pgwt-box-check.lock (also covering an
    # agent's ad hoc `make box-check` over ssh, which no concurrency group
    # could ever see anyway) — that lock is what actually serialises
    # same-box access, and it queues rather than cancels.
    #
    # Fork PRs (reviewer round 2, option c): a job-level `if:` that SKIPS the
    # job for a fork PR is the wrong shape — GitHub scores a skipped required
    # check as passing, so a fork PR would be mergeable with zero capture
    # coverage. Instead the job always runs; `runs-on` itself picks
    # `ubuntu-latest` for a fork PR (never touches the self-hosted label, so
    # the gate box is unreachable for fork code even for job scheduling) and
    # the first step below is the ONLY step that executes there — it fails
    # loudly, so the required check is red, not green-by-omission, until a
    # maintainer re-hosts the PR's head as `agent/<slug>` and re-runs. It
    # runs on a hosted runner, so it needs no group either.
    #
    # timeout-minutes: observed per-cell durations (uncontended) were
    # 6-13 min including full-mode assertions; 180 covers that plus the
    # bounded lock wait (120 min) below, since agents' `make box-check` runs
    # hold /tmp/pgwt-box-check.lock for 45-80 min each and queueing behind
    # them is the design (a 15-min bound turned master red on 2026-09-18).
    name: capture-smoke (PG ${{ matrix.pg }})
    needs: changed_files
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","gate-box"]') }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 16, 17, 18]
    steps:
      # The ONLY step that runs for a fork PR (on ubuntu-latest, per
      # runs-on above): fails on purpose so the required check is red, not
      # skipped-therefore-green. Skipped entirely (a no-op) for every other
      # trigger.
      - name: Refuse fork PR (gate checks need a maintainer to re-host)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "gate checks run only from a branch in this repository; a maintainer must push this PR's head to agent/<slug> and re-run" >&2
          exit 1

      # Path-filter gate (changed-files job): src/ (or src/bpf/) changed ->
      # this matrix cell always runs (the full matrix, never reduced). No
      # src/ change but web/, tests/ or tooling did -> only the PG 18 cell
      # runs (newest supported version; live-UI-smoke + real-PG capture
      # still need to prove themselves once). Docs-only -> no cell runs.
      # This step RUNS (never a job-level `if:`, which reports as GitHub's
      # "skipped" conclusion) and every step below is individually gated on
      # its output, so the check always completes with an explicit
      # pass/fail, keeping the required-status-checks contract intact (9
      # named checks, one per matrix value; see branch protection).
      - name: Determine whether this capture cell is needed
        id: needed_filter
        run: |
          SRC="${{ needs.changed_files.outputs.src_changed }}"
          DOCS_ONLY="${{ needs.changed_files.outputs.docs_only }}"
          if [ "$SRC" = "true" ]; then
            NEEDED=true
          elif [ "$DOCS_ONLY" = "false" ] && [ "${{ matrix.pg }}" = "18" ]; then
            NEEDED=true
          else
            NEEDED=false
          fi
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          if [ "$NEEDED" = "true" ]; then
            echo "capture-smoke (PG ${{ matrix.pg }}): running (src_changed=$SRC docs_only=$DOCS_ONLY)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "capture-smoke (PG ${{ matrix.pg }}): SKIPPED -- no src/ change, and either docs-only or not the PG 18 reduced-tier cell (src_changed=$SRC docs_only=$DOCS_ONLY); reports success to satisfy the required check" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Real bug found running this against the box for the first time: this
      # is a PERSISTENT runner (not ephemeral) reusing the same
      # $GITHUB_WORKSPACE across jobs, and every test step below runs test
      # code under `sudo` (root) — a prior job's sudo-run python3 leaves
      # root-owned tests/__pycache__/*.pyc behind. The unprivileged 'runner'
      # user that owns the workspace can't unlink those, so actions/checkout
      # (which starts by cleaning the workspace) fails outright with EACCES
      # before this job does anything of its own. Reclaim ownership first.
      - name: Reclaim workspace ownership (previous job may have left root-owned files)
        if: steps.needed_filter.outputs.needed == 'true'
        run: sudo chown -R "$(id -un):$(id -gn)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      # Self-heal: a root-created 0644 lock file (e.g. from provision-runner.sh
      # before its own chmod fix, or a fresh /tmp after a reboot) wedges every
      # gate-box step's `exec 9>...` for the unprivileged 'runner' user.
      - name: Ensure gate-box lock file is writable
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          [ -w /tmp/pgwt-box-check.lock ] || sudo sh -c 'touch /tmp/pgwt-box-check.lock && chmod 0666 /tmp/pgwt-box-check.lock'

      - uses: actions/checkout@v4
        if: steps.needed_filter.outputs.needed == 'true'

      # tests/provision-runner.sh writes this marker once the gate box has
      # build deps + bpftool + PostgreSQL 13/16/17/18 already installed and
      # running on ports 5413/5416/5417/5418 — skip reinstalling/
      # reconfiguring PostgreSQL and reuse that cluster directly. Any
      # self-hosted,gate-box runner WITHOUT the marker falls back to the
      # hosted-style install path below UNLESS it's actually self-hosted
      # (see the refusal step next), in which case that path is destructive
      # and must never run.
      - name: Detect pre-provisioned gate box
        if: steps.needed_filter.outputs.needed == 'true'
        id: gate_box
        run: |
          if [ -f /etc/pgwt-gate-box ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Reviewer finding: the fallback install path below runs
      # `pg_dropcluster` on every existing cluster before reinstalling on
      # port 5432 — correct for a genuinely fresh `ubuntu-latest` runner,
      # destructive on any self-hosted runner that merely lacks the marker
      # (a mis-labelled future ephemeral runner, or this box before its
      # first provisioning run). `runner.environment` (`github-hosted` /
      # `self-hosted`) is the authoritative signal, unlike `RUNNER_NAME`
      # (set identically either way, so not a discriminator on its own).
      # The hosted-style path stays reachable only for an actual hosted
      # runner — which `runs-on: [self-hosted, gate-box]` no longer offers
      # this job anyway, so today it is also unreachable there; this refusal
      # is the enforced, not just structural, guarantee.
      - name: Refuse destructive re-install on an unprovisioned self-hosted runner
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true' && runner.environment != 'github-hosted'
        run: |
          echo "FATAL: gate-box marker missing; run tests/provision-runner.sh ubuntu" >&2
          exit 1

      - name: Install build dependencies
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev \
            zlib1g-dev liblz4-dev linux-tools-common
          # Same bpftool fallback as build-and-unit: the runner's HWE azure
          # kernel may ship linux-tools without a bpftool binary.
          if bpftool version >/dev/null 2>&1; then
            BPFTOOL=$(command -v bpftool)
          else
            git clone --depth 1 --branch v7.5.0 --recurse-submodules \
              https://github.com/libbpf/bpftool.git /tmp/bpftool
            make -C /tmp/bpftool/src -j"$(nproc)"
            BPFTOOL=/tmp/bpftool/src/bpftool
          fi
          "$BPFTOOL" version
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"
          test -r /sys/kernel/btf/vmlinux

      - name: Install PostgreSQL ${{ matrix.pg }} (PGDG apt)
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          set -x
          V=${{ matrix.pg }}
          # Stop and drop any preinstalled clusters so ours owns port 5432.
          sudo systemctl stop postgresql || true
          sudo apt-get install -y postgresql-common
          pg_lsclusters -h | awk '{print $1, $2}' | while read -r ver name; do
            sudo pg_dropcluster --stop "$ver" "$name" || true
          done
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          # PG13 is EOL: when the live PGDG repo no longer carries it, fall
          # back to the PGDG apt archive (same signing key).
          if ! apt-cache show "postgresql-$V" >/dev/null 2>&1; then
            echo "postgresql-$V not in the live PGDG repo — adding apt-archive"
            echo "deb https://apt-archive.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg-archive.list
            sudo apt-get update
          fi
          sudo apt-get install -y "postgresql-$V" "postgresql-contrib-$V"

      - name: Configure + start PostgreSQL ${{ matrix.pg }}
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present != 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          set -ex
          V=${{ matrix.pg }}
          # The postgresql-$V package auto-creates cluster "main" unless one
          # already existed (e.g. the preinstalled PG16 we dropped above).
          if ! pg_lsclusters -h | awk -v v="$V" '$1 == v && $2 == "main"' | grep -q .; then
            sudo pg_createcluster "$V" main
          fi
          sudo pg_conftool "$V" main set port 5432
          # pg_stat_statements everywhere:
          #  - PG13: REQUIRED for query attribution (no in-core query_id;
          #    the tracer walks PlannedStmt.queryId that pgss populates).
          #  - PG14+: compute_query_id=on so st_query_id is populated.
          sudo pg_conftool "$V" main set shared_preload_libraries pg_stat_statements
          if [ "$V" -ge 14 ]; then
            sudo pg_conftool "$V" main set compute_query_id on
          fi
          # Tests connect as "psql -U postgres" from root: trust local auth.
          sudo sed -i -E 's/(peer|scram-sha-256|md5)$/trust/' \
            "/etc/postgresql/$V/main/pg_hba.conf"
          sudo pg_ctlcluster "$V" main start
          psql -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
          psql -U postgres -d postgres -tAc "SELECT version()"
          echo "CS_PGPORT=5432" >> "$GITHUB_ENV"

      # Gate box already has PG${{ matrix.pg }} on port 54${{ matrix.pg }}
      # (tests/provision-runner.sh); no install/config step ran above, so
      # resolve BPFTOOL and the port here instead. Locked: provision-runner.sh
      # restarts clusters inside this same lock, so probing psql without it
      # could hit a cluster mid-restart.
      - name: Resolve gate-box PostgreSQL port + bpftool
        if: steps.needed_filter.outputs.needed == 'true' && steps.gate_box.outputs.present == 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          V=${{ matrix.pg }}
          command -v bpftool >/dev/null || { echo "FATAL: bpftool not on PATH on the gate box" >&2; exit 1; }
          echo "BPFTOOL=$(command -v bpftool)" >> "$GITHUB_ENV"
          echo "CS_PGPORT=54${V}" >> "$GITHUB_ENV"
          psql -U postgres -h /var/run/postgresql -p "54${V}" -d postgres -tAc "SELECT version()"

      - name: Build (BPF tracer + pgwt-server)
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          make

      - name: Run capture smoke (tiered hard; full if watchpoints available)
        if: steps.needed_filter.outputs.needed == 'true'
        run: |
          exec 9>/tmp/pgwt-box-check.lock
          flock -w 7200 9 || { echo "FATAL: /tmp/pgwt-box-check.lock held >120 min" >&2; exit 1; }
          V=${{ matrix.pg }}
          # PG16 = unsupported version: assert the loud-refusal contract.
          FLAGS=""
          [ "$V" = "16" ] && FLAGS="--expect-unsupported"
          # sudo strips the environment: pass PATH (psql/pgbench), PGPORT
          # (the workload side — psql/pgbench in test_capture_smoke.py
          # connect with no explicit -p, so on the gate box's multi-cluster
          # layout this must be set explicitly or they'd hit Debian's
          # pg_wrapper default/ambient cluster instead of the one this cell
          # is tracing), and GITHUB_STEP_SUMMARY (the loud watchpoint-skip
          # note). BPFTOOL: the uprobe run_cnt assertion (T2) needs a
          # working bpftool inside the sudo environment.
          sudo env "PATH=/usr/lib/postgresql/$V/bin:$PATH" \
            "PGPORT=$CS_PGPORT" \
            "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" \
            "BPFTOOL=$BPFTOOL" \
            tests/ci_smoke.sh --pg-version "$V" $FLAGS

  # Opt-in only: a plain `workflow_dispatch` (the kind agents use to prove a
  # branch on the gate box) does NOT launch this job — it also requires the
  # `mode4_hunt` boolean input to be set (issue #117; before this, every
  # manual dispatch fired the 360-minute hunt on a hosted runner unasked).
  mode4-hunt:
    name: mode4-hunt
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode4_hunt }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize hunt artifacts
        run: |
          printf '%s\n' 'hunt did not start' > mode4-strike.log
          printf '%s\n' 'hunt did not start' > mode4-hunt-summary.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev \
            zlib1g-dev liblz4-dev linux-tools-common
          # Same bpftool fallback as capture-smoke: the runner's HWE azure
          # kernel may ship linux-tools without a bpftool binary.
          if bpftool version >/dev/null 2>&1; then
            BPFTOOL=$(command -v bpftool)
          else
            git clone --depth 1 --branch v7.5.0 --recurse-submodules \
              https://github.com/libbpf/bpftool.git /tmp/bpftool
            make -C /tmp/bpftool/src -j"$(nproc)"
            BPFTOOL=/tmp/bpftool/src/bpftool
          fi
          "$BPFTOOL" version
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"
          test -r /sys/kernel/btf/vmlinux

      - name: Install PostgreSQL ${{ inputs.pg }} (PGDG apt)
        env:
          PG_MAJOR: ${{ inputs.pg }}
        run: |
          set -x
          V="$PG_MAJOR"
          sudo systemctl stop postgresql || true
          sudo apt-get install -y postgresql-common
          pg_lsclusters -h | awk '{print $1, $2}' | while read -r ver name; do
            sudo pg_dropcluster --stop "$ver" "$name" || true
          done
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          if ! apt-cache show "postgresql-$V" >/dev/null 2>&1; then
            echo "postgresql-$V not in the live PGDG repo — adding apt-archive"
            echo "deb https://apt-archive.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg-archive.list
            sudo apt-get update
          fi
          sudo apt-get install -y "postgresql-$V" "postgresql-contrib-$V"

      - name: Configure + start PostgreSQL ${{ inputs.pg }}
        env:
          PG_MAJOR: ${{ inputs.pg }}
        run: |
          set -ex
          V="$PG_MAJOR"
          if ! pg_lsclusters -h | awk -v v="$V" '$1 == v && $2 == "main"' | grep -q .; then
            sudo pg_createcluster "$V" main
          fi
          sudo pg_conftool "$V" main set port 5432
          sudo pg_conftool "$V" main set shared_preload_libraries pg_stat_statements
          if [ "$V" -ge 14 ]; then
            sudo pg_conftool "$V" main set compute_query_id on
          fi
          sudo sed -i -E 's/(peer|scram-sha-256|md5)$/trust/' \
            "/etc/postgresql/$V/main/pg_hba.conf"
          sudo pg_ctlcluster "$V" main start
          psql -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
          psql -U postgres -d postgres -tAc "SELECT version()"

      - name: Build (BPF tracer + pgwt-server)
        run: make

      - name: Hunt the fourth full-mode straddle failure
        env:
          HUNT_ITERATIONS: ${{ inputs.iterations }}
          PG_MAJOR: ${{ inputs.pg }}
          PGWT_DEBUG_DUMP_STATE: "1"
        run: |
          set -euo pipefail
          burn_cpu() {
            while :; do :; done
          }
          burn_cpu &
          BURNER_ONE=$!
          burn_cpu &
          BURNER_TWO=$!
          cleanup_burners() {
            kill "$BURNER_ONE" "$BURNER_TWO" 2>/dev/null || true
            wait "$BURNER_ONE" "$BURNER_TWO" 2>/dev/null || true
          }
          trap cleanup_burners EXIT

          PATH="/usr/lib/postgresql/$PG_MAJOR/bin:$PATH" \
            python3 .github/scripts/mode4_hunt.py \
              --iterations "$HUNT_ITERATIONS" \
              --pg-version "$PG_MAJOR"

      - name: Upload mode-4 hunt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode4-hunt-${{ inputs.pg }}-${{ github.run_attempt }}
          path: |
            mode4-strike.log
            mode4-hunt-summary.txt
          if-no-files-found: error

  web-ui:
    name: web-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + websockets
        # playwright is PINNED (U0 snapshot provenance): `playwright install`
        # pins the chromium build per playwright VERSION only, so an unpinned
        # pip install silently changes the browser under the suites (and under
        # the snapshot baselines) on every upstream release. Keep in sync with
        # the snapshots job and tests/web_snapshots/VERSION.
        run: |
          python3 -m pip install playwright==1.60.0 websockets
          python3 -m playwright install --with-deps chromium

      - name: Run web UI tests (mock server)
        run: python3 tests/test_web_ui.py

      - name: Run web UI chaos tests (adversarial mock — Phase B2)
        # Drives the UI against mock_server.py in chaos mode (latency jitter,
        # out-of-order + late responses). Race-exposing tests are classified
        # gating vs xfail inside the suite, so this stays green; an xfail that
        # starts passing is reported (XPASS) for promotion, never fatal.
        run: python3 tests/test_web_ui_chaos.py

      # U0 suite hygiene: every check() failure wrote a full-page screenshot +
      # console tail under tests/results/web_ui_failures/ — surface them.
      - name: Upload failure artifacts (screenshots + console tails)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-failures
          path: tests/results/web_ui_failures/
          if-no-files-found: ignore

  protocol-drift:
    name: protocol-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (server only, no BPF)
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblz4-dev

      - name: Build pgwt-server + trace generator
        run: |
          make pgwt-server
          make -C tests gen_test_traces

      - name: Run protocol drift test (real server vs mock)
        run: python3 tests/test_protocol_drift.py

  snapshots:
    # Visual-regression snapshots (Phase B4). Catches the "renders without
    # errors but looks wrong" class (dropped series color, layout breakage)
    # that DOM/getOption() assertions miss. GATING on PR/push.
    #
    # Determinism: Playwright screenshots are environment-sensitive, so the
    # committed baselines (tests/web_snapshots/*.png) are generated by THIS
    # SAME job (ubuntu-latest + the chromium of the PINNED playwright below —
    # `playwright install` pins per playwright version only, so playwright
    # itself must be pinned; provenance in tests/web_snapshots/VERSION) via
    # the workflow_dispatch `update_snapshots` input — never locally. The
    # Playwright context pins viewport/device-scale/reduced-motion/animations;
    # the mock dataset has a fixed time base. A small pixel-diff tolerance
    # absorbs antialiasing.
    name: snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Pillow + numpy + websockets
        # playwright PINNED to the version the committed baselines were made
        # with (tests/web_snapshots/VERSION). Bumping it = regenerating the
        # baselines (update_snapshots dispatch) + updating VERSION, in one PR.
        run: |
          python3 -m pip install playwright==1.60.0 websockets pillow numpy
          python3 -m playwright install --with-deps chromium

      - name: Print chromium revision (for baseline provenance)
        run: python3 -m playwright --version

      # COMPARE mode (PR/push, or a manual run without the input): gating.
      - name: Compare visual snapshots against baselines
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_snapshots }}
        env:
          CI: "1"
        run: python3 tests/test_web_ui_snapshots.py

      # On a compare failure, upload actual + diff PNGs so a regression (or a
      # legitimate baseline update) can be reviewed.
      - name: Upload snapshot diffs on failure
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || !inputs.update_snapshots) }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: |
            tests/web_snapshots/*-actual.png
            tests/web_snapshots/*-diff.png
            tests/web_snapshots/gallery/*-actual.png
            tests/web_snapshots/gallery/*-diff.png
          if-no-files-found: ignore

      # U0 suite hygiene: the suite also wrote a full-page screenshot +
      # console tail per failed snapshot under tests/results/web_ui_failures/
      # (covers failures with no -actual/-diff, e.g. a missing selector).
      - name: Upload failure artifacts (screenshots + console tails)
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || !inputs.update_snapshots) }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-failures
          path: tests/results/web_ui_failures/
          if-no-files-found: ignore

      # UPDATE mode (manual workflow_dispatch with update_snapshots=true):
      # regenerate baselines and upload them; not gating.
      - name: Generate baselines (--update-snapshots)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        env:
          CI: "1"
        run: python3 tests/test_web_ui_snapshots.py --update-snapshots

      - name: Upload generated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-baselines
          path: |
            tests/web_snapshots/*.png
            tests/web_snapshots/gallery/*.png
