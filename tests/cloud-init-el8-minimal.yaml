#cloud-config
# Minimal cloud-init for a Rocky 8 gate box, mirroring cloud-init-ubuntu-minimal.yaml
# (tests/hetzner-vm.sh create --type cx33 --image rocky-8).
#
# Deliberately does NOT install PostgreSQL/build deps/a runner here: that is
# tests/provision-runner.sh el8's job, run over ssh after boot, so provisioning
# stays idempotent and re-runnable without recreating the VM. This file only
# makes sure the box is ready for that first ssh + rsync.

runcmd:
  - dnf install -y rsync
